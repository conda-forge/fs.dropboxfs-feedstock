{% set name = "fs.dropboxfs" %}
{% set version = "1.0.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fs_dropboxfs-{{ version }}.tar.gz
  sha256: e49032a9a7bb3a894e52df3e8852e1ee3a2ccfd830151f5a8af8ef57758175e8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - dropbox >=12.0.2
    - fs >=2.0.10
    - setuptools >=70

test:
  imports:
    - fs.dropboxfs
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/PyFilesystem/fs.dropboxfs
  summary: Pyfilesystem2 implementation for Dropbox
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - bgruening
